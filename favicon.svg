<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730a3" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Fons arrodonit amb gradient de marca -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Vora subtil interior -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Text del logotip 2E -->
  <text x="32" y="37" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1" filter="url(#shadow)">2E</text>
  
  <!-- Punt brillant decoratiu -->
  <circle cx="50" cy="14" r="3.5" fill="#38bdf8" />
</svg>
