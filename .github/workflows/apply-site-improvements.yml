name: Build and polish Grammar Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final polish and build production CSS
        run: python scripts/apply_site_improvements.py

      - name: Simplify shared practice and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/site.js')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'(function addLearningRoute\(\) \{\s*)if \(!unitMatch\) return;',
              r'\1if (!unitMatch || !unitMatch[2]) return;',
              text,
              count=1,
          )

          text = re.sub(
              r'\n  function addOpenProductionForUnit2\(\) \{.*?\n  \}\n\n(?=  document\.addEventListener)',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace('    addOpenProductionForUnit2();\n', '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Diversify self-assessment answer positions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          marker = '// Balanced answer positions for the final self-assessment'
          base_pattern = [1, 3, 0, 2, 3, 1, 2, 0, 1, 2]

          for unit in range(1, 9):
              path = Path(f'unit{unit}.html')
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if 'const quizQuestions = [' not in text:
                  raise RuntimeError(f'No s’ha trobat quizQuestions a {path}')

              needle = '\n    let currentQuizIndex = 0;'
              if needle not in text:
                  raise RuntimeError(f'No s’ha trobat el punt d’inserció del test a {path}')

              offset = unit - 1
              pattern = ', '.join(str(n) for n in base_pattern)
              snippet = f'''\n    {marker}\n    (() => {{\n      const answerPattern = [{pattern}];\n      const unitOffset = {offset};\n      quizQuestions.forEach((question, index) => {{\n        if (!Array.isArray(question.options) || typeof question.correct !== 'number' || question.options.length < 2) return;\n        const desiredIndex = (answerPattern[index % answerPattern.length] + unitOffset) % question.options.length;\n        if (desiredIndex === question.correct) return;\n        const correctOption = question.options[question.correct];\n        question.options.splice(question.correct, 1);\n        question.options.splice(desiredIndex, 0, correctOption);\n        question.correct = desiredIndex;\n      }});\n    }})();\n'''
              text = text.replace(needle, snippet + needle, 1)
              path.write_text(text, encoding='utf-8')

          for unit in range(1, 9):
              text = Path(f'unit{unit}.html').read_text(encoding='utf-8')
              if marker not in text:
                  raise RuntimeError(f'La diversificació no s’ha aplicat a unit{unit}.html')
          PY

      - name: Remove duplicate font links from HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.googleapis\.com[^>]*>\s*', '\n', text, flags=re.I)
              text = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.gstatic\.com[^>]*>\s*', '\n', text, flags=re.I)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Apply shared portal theme and audited readability layers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          theme_css = '<link rel="stylesheet" href="portal-theme.css?v=3">'
          contrast_css = '<link rel="stylesheet" href="portal-contrast.css?v=2">'
          readability_css = '<link rel="stylesheet" href="portal-readability.css?v=1">'
          final_contrast_css = '<link rel="stylesheet" href="portal-final-contrast.css?v=3">'
          theme_js = '<script src="portal-theme.js?v=5"></script>'

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'assets/site\.js(?:\?v=\d+)?', 'assets/site.js?v=7', text)
              text = re.sub(r'assets/site\.css(?:\?v=\d+)?', 'assets/site.css?v=7', text)
              text = re.sub(r'portal-theme\.css(?:\?v=\d+)?', 'portal-theme.css?v=3', text)
              text = re.sub(r'portal-contrast\.css(?:\?v=\d+)?', 'portal-contrast.css?v=2', text)
              text = re.sub(r'portal-readability\.css(?:\?v=\d+)?', 'portal-readability.css?v=1', text)
              text = re.sub(r'portal-final-contrast\.css(?:\?v=\d+)?', 'portal-final-contrast.css?v=3', text)
              text = re.sub(r'portal-theme\.js(?:\?v=\d+)?', 'portal-theme.js?v=5', text)

              if 'portal-theme.css' not in text:
                  text = re.sub(
                      r'(<link rel="stylesheet" href="assets/site\.css\?v=7">)',
                      r'\1\n  ' + theme_css,
                      text,
                      count=1,
                  )

              if 'portal-contrast.css' not in text:
                  text = re.sub(
                      r'(<link rel="stylesheet" href="portal-theme\.css\?v=3">)',
                      r'\1\n  ' + contrast_css,
                      text,
                      count=1,
                  )

              if 'portal-readability.css' not in text:
                  text = re.sub(
                      r'(<link rel="stylesheet" href="portal-contrast\.css\?v=2">)',
                      r'\1\n  ' + readability_css,
                      text,
                      count=1,
                  )

              if 'portal-final-contrast.css' not in text:
                  text = re.sub(
                      r'(<link rel="stylesheet" href="portal-readability\.css\?v=1">)',
                      r'\1\n  ' + final_contrast_css,
                      text,
                      count=1,
                  )

              if 'portal-theme.js' not in text:
                  text = text.replace('</head>', '  ' + theme_js + '\n</head>', 1)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Automated contrast audit for every page in light and dark mode
        run: |
          trap 'rm -rf node_modules' EXIT
          npm install --no-save --package-lock=false playwright axe-core
          npx playwright install chromium
          node scripts/check_contrast.mjs

      - name: Commit generated updates
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diversificar autoavaluacions i validar contrast"
          git push
