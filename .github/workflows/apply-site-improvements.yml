name: Apply site improvements

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply improvements
        run: python scripts/apply_site_improvements.py

      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md *.html
          git commit -m "Aplicar millores pedagògiques i d'accessibilitat"
          git push
